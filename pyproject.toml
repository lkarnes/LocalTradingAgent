[project]
name = "local-trading-agent"
version = "0.1.0"
description = "A local AI-assisted research and paper trading platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "apscheduler>=3.10",
  "httpx>=0.27",
  "pandas>=2.2",
  "numpy>=2.1",
  "ta>=0.11",
  "exchange-calendars>=4.5",
  "feedparser>=6.0",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.12",
  "itsdangerous>=2.2",
  "passlib[bcrypt]>=1.7",
  "yfinance>=0.2",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
trading-agent = "app.cli:main"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

